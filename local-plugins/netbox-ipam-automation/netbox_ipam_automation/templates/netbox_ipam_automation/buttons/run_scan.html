{% if url and can_run %}
  <form action="{{ url }}{% if url_params %}?{{ url_params }}{% endif %}" method="post" class="d-inline">
    {% csrf_token %}
    <button type="submit" class="btn btn-success">
      <i class="mdi mdi-play" aria-hidden="true"></i> {{ label }}
    </button>
  </form>
{% endif %}
